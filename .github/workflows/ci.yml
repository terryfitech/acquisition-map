name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: High-confidence secret pattern check
        shell: bash
        run: |
          if git grep -I -n -E -- \
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{36,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}' \
            -- ':!uv.lock'; then
            echo "Potential credential material detected in tracked files."
            exit 1
          fi
          echo "No high-confidence credential patterns detected."

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Compile source
        run: uv run python -m compileall -q src

      - name: Test
        run: uv run pytest -q

      - name: Audit dependencies
        run: uv run pip-audit

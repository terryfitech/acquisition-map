name: Bootstrap uv lockfile

on:
  push:
    branches:
      - setup/production-foundation
    paths:
      - pyproject.toml
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out setup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: setup/production-foundation

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install 3.13

      - name: Generate lockfile
        run: uv lock

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: generate uv lockfile"
          git push origin HEAD:setup/production-foundation
